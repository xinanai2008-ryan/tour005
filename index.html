const TYPE_NAME = {judge:'判断题', single:'单选题', multi:'多选题'};
const TYPE_CYCLE = ['judge', 'single', 'multi'];
const LS_KEY = 'bjguide2026_progress_tour005';
const ROUND_KEY = LS_KEY + '_round';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e) { progress = {}; }
let round = 1;
try { round = Math.max(1, parseInt(localStorage.getItem(ROUND_KEY) || '1') || 1); } catch(e) {}
const activeType = TYPE_CYCLE[(round - 1) % 3];
function saveProgress() { try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch(e) {} }
function saveRound() { try { localStorage.setItem(ROUND_KEY, String(round)); } catch(e) {} }

// 知识点分组：同章节+同资料原文 = 同一考点
const groups = {};
DATA.forEach((q, i) => {
  const key = (q.section || '') + '|' + (q.source || q.q);
  (groups[key] = groups[key] || []).push(i);
});
// 本轮牌组：每组优先取主打题型的变体，没有就顺延取下一个题型
const inDeck = new Set();
Object.values(groups).forEach(g => {
  for (let k = 0; k < 3; k++) {
    const t = TYPE_CYCLE[(TYPE_CYCLE.indexOf(activeType) + k) % 3];
    const cand = g.filter(i => DATA[i].type === t);
    if (cand.length) { cand.forEach(i => inDeck.add(i)); return; }
  }
});
document.getElementById('roundInfo').textContent = '🔁 第 ' + round + ' 轮 · 主打' + TYPE_NAME[activeType];
document.getElementById('tTotal').textContent = inDeck.size;
document.getElementById('deckTotal').textContent = inDeck.size;

let curType = 'all', curSec = 'all', curLayer = 'all';

const secs = [...new Set(DATA.map(q => q.section))];
const secCount = {};
DATA.forEach(q => secCount[q.section] = (secCount[q.section]||0)+1);
const sf = document.getElementById('secfilter');
const secChips = {};   // 章节名 -> 按钮元素（做绿色进度条）
const allChip = sf.querySelector('.chip[data-s="all"]');
secs.forEach(s => {
  const d = document.createElement('div');
  d.className = 'chip'; d.dataset.s = s;
  d.innerHTML = s + ' <b>0/' + secCount[s] + '</b>';
  secChips[s] = d;
  sf.appendChild(d);
});
// 按本轮完成度给按钮填充绿色进度
function paintChips(secAgg, totalA, totalT) {
  const paint = (el, a, t) => {
    if (!el) return;
    const pct = t ? Math.round(a / t * 100) : 0;
    el.style.background = `linear-gradient(to right, rgba(52,168,83,.38) ${pct}%, rgba(52,168,83,.10) ${pct}%)`;
    const b = el.querySelector('b');
    if (b) b.textContent = `${a}/${t}`;
  };
  Object.entries(secChips).forEach(([s, el]) => {
    const g = secAgg[s] || { t: secCount[s], a: 0 };
    paint(el, g.a, g.t);
  });
  paint(allChip, totalA, totalT);
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); curType = t.dataset.t; applyFilter();
});
sf.onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  sf.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); curSec = c.dataset.s; applyFilter();
};
const lf = document.getElementById('layerfilter');
lf.onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  lf.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); curLayer = c.dataset.l; applyFilter();
};
function applyFilter() {
  const visibleSecs = new Set();
  document.querySelectorAll('.card').forEach(card => {
    if (card.dataset.deck !== '1') return;   // 非本轮牌组的题始终隐藏
    const st = progress[card.dataset.idx];
    let okT;
    if (curType === 'all') okT = true;
    else if (curType === 'undo') okT = !st;
    else if (curType === 'wronged') okT = st === 'w';
    else okT = card.dataset.type === curType;
    const okS = curSec === 'all' || card.dataset.sec === curSec;
    const okL = curLayer === 'all' || card.dataset.layer === curLayer;
    card.classList.toggle('hidden', !(okT && okS && okL));
    if (!card.classList.contains('hidden')) visibleSecs.add(card.dataset.sec);
  });
  // 章节统计条：本章无可见题时隐藏
  document.querySelectorAll('.secstat').forEach(el => el.classList.toggle('hidden', !visibleSecs.has(el.dataset.sec)));
  // 分割线：只有其后仍有可见题目时才显示
  let lastDiv = null, lastVisible = false;
  const flush = () => { if (lastDiv) lastDiv.classList.toggle('hidden', !lastVisible); };
  list.childNodes.forEach(el => {
    if (el.classList && el.classList.contains('typediv')) { flush(); lastDiv = el; lastVisible = false; }
    else if (el.classList && el.classList.contains('card')) {
      if (!el.classList.contains('hidden')) lastVisible = true;
    }
  });
  flush();
  refreshScore();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function refreshScore() {
  let a = 0, c = 0, w = 0, visTotal = 0;
  document.querySelectorAll('.card').forEach(card => {
    if (card.dataset.deck !== '1') return;
    visTotal++;
    const st = progress[card.dataset.idx];
    if (st === 'c') { a++; c++; } else if (st === 'w') { a++; w++; }
  });
  document.getElementById('answered').textContent = a;
  document.getElementById('correct').textContent = c;
  document.getElementById('wrong').textContent = w;
  document.getElementById('rate').textContent = a ? Math.round(c/a*100)+'%' : '—';
  document.getElementById('tDone').textContent = a;
  document.getElementById('tTotal').textContent = visTotal;
  document.getElementById('tPct').textContent = visTotal ? Math.round(a/visTotal*100)+'%' : '0%';
  document.getElementById('tRate').textContent = a ? Math.round(c/a*100)+'%' : '—';
  // 每章本轮统计（开头/结尾两条同步更新）
  const secAgg = {};
  document.querySelectorAll('.card').forEach(card => {
    if (card.dataset.deck !== '1') return;
    const s = card.dataset.sec;
    const g = secAgg[s] = secAgg[s] || { t: 0, a: 0, c: 0 };
    g.t++;
    const st = progress[card.dataset.idx];
    if (st === 'c') { g.a++; g.c++; } else if (st === 'w') g.a++;
  });
  Object.entries(secEls).forEach(([sec, els]) => {
    const g = secAgg[sec] || { t: 0, a: 0, c: 0 };
    const txt = `本轮已答 ${g.a}/${g.t} · 正确率 ${g.a ? Math.round(g.c/g.a*100)+'%' : '—'}`;
    els.forEach(e => e.textContent = txt);
  });
  paintChips(secAgg, a, visTotal);
}
document.getElementById('resetTop').onclick = () => {
  const nextType = TYPE_CYCLE[round % 3];
  if (!confirm('清空本轮答题进度，进入第 ' + (round + 1) + ' 轮？\n同一批考点将换成「' + TYPE_NAME[nextType] + '」为主重新考。')) return;
  progress = {}; saveProgress();
  round++; saveRound();
  location.reload();
};

const list = document.getElementById('list');
const LETTERS = 'ABCDEFG';
const cardEls = [];
const secEls = {};   // 章节名 -> [顶部统计条, 底部统计条] 的文本节点
function mkStat(sec) {
  const d = document.createElement('div');
  d.className = 'secstat'; d.dataset.sec = sec;
  d.innerHTML = `<span>📊 <b>${sec}</b></span><span class="sv">本轮已答 0/0 · 正确率 —</span>`;
  (secEls[sec] = secEls[sec] || []).push(d.querySelector('.sv'));
  return d;
}
let prevType = null, prevSec = null;
DATA.forEach((q, i) => {
  const inD = inDeck.has(i);
  if (q.section !== prevSec) {   // 章节过渡：上一章底部统计条 + 本章顶部统计条
    if (prevSec !== null) list.appendChild(mkStat(prevSec));
    list.appendChild(mkStat(q.section));
    prevSec = q.section; prevType = null;
  }
  if (q.type !== prevType) {   // 题型过渡区：红色分割线
    const dv = document.createElement('div');
    dv.className = 'typediv';
    dv.innerHTML = `<span>— ${TYPE_NAME[q.type]} —</span>`;
    list.appendChild(dv);
    prevType = q.type;
  }
  // 选择题选项乱序 + 答案字母重映射（每次刷新都不一样）
  let dispOpts = null, dispAnswer = q.answer;
  if (q.type !== 'judge') {
    dispOpts = q.options.map((text, j) => ({ text, orig: LETTERS[j] }));
    for (let k = dispOpts.length - 1; k > 0; k--) {
      const r = Math.floor(Math.random() * (k + 1));
      [dispOpts[k], dispOpts[r]] = [dispOpts[r], dispOpts[k]];
    }
    dispOpts.forEach((o, j) => o.newL = LETTERS[j]);
    dispAnswer = dispOpts.filter(o => q.answer.includes(o.orig)).map(o => o.newL).sort().join('');
  }
  const card = document.createElement('div');
  card.className = 'card' + (inD ? '' : ' hidden');
  card.dataset.type = q.type; card.dataset.sec = q.section; card.dataset.idx = i; card.dataset.layer = q.layer || 'ext';
  card.dataset.deck = inD ? '1' : '0';
  card.dataset.ans = dispAnswer;
  cardEls[i] = card;
  const layerTag = (q.layer === 'core') ? '🎯' : '📚';
  const oosTag = q.oos ? '<span class="qoos">考纲外·了解即可</span>' : '';
  const label = q.type === 'multi' ? ' <span style="font-size:12px;color:var(--sub);font-weight:400">（多选，选出后点「提交」）</span>' : '';
  let optsHtml = '';
  if (q.type === 'judge') {
    optsHtml = `<div class="opts"><div class="opt" data-v="对">A. 对</div><div class="opt" data-v="错">B. 错</div></div>`;
  } else {
    optsHtml = `<div class="opts">` + dispOpts.map(o =>
      `<div class="opt" data-v="${o.newL}">${o.newL}. ${o.text.replace(/^[A-G]\.\s*/, '')}</div>`).join('') +
      (q.type === 'multi' ? `<button class="multi-submit" disabled>提交</button>` : '') + `</div>`;
  }
  const srcHtml = q.source ? `<div class="src"><span class="srctag">📖 资料原文</span><div class="srcbody">${q.source}</div></div>` : '';
  card.innerHTML = `
    <div class="qhead"><span class="qnum">${i + 1}.</span><span class="qsec">${layerTag} ${q.section} · ${TYPE_NAME[q.type]}</span>${oosTag}</div>
    <div class="qtext">${q.q}${label}</div>
    ${optsHtml}
    <div class="explain"><span class="verdict"></span><b>答案：${dispAnswer}</b>　${q.explain || ''}${srcHtml}</div>`;
  list.appendChild(card);

  const opts = card.querySelectorAll('.opt');
  const explain = card.querySelector('.explain');
  const verdict = card.querySelector('.verdict');
  const done = ok => {
    progress[i] = ok ? 'c' : 'w'; saveProgress();
    verdict.textContent = ok ? '✓ 回答正确' : '✗ 回答错误';
    verdict.className = 'verdict ' + (ok ? 'ok' : 'bad');
    explain.classList.add('show');
    opts.forEach(o => o.classList.add('disabled'));
    refreshScore();
  };

  if (q.type === 'multi') {
    const btn = card.querySelector('.multi-submit');
    const picked = new Set();
    opts.forEach(o => o.onclick = () => {
      if (o.classList.contains('disabled')) return;
      const v = o.dataset.v;
      picked.has(v) ? (picked.delete(v), o.classList.remove('picked')) : (picked.add(v), o.classList.add('picked'));
      btn.disabled = picked.size === 0;
    });
    btn.onclick = () => {
      if (btn.disabled) return;
      btn.disabled = true;
      const mine = [...picked].sort().join('');
      const ok = mine === dispAnswer;
      opts.forEach(o => {
        const v = o.dataset.v;
        if (dispAnswer.includes(v)) o.classList.add('right');
        else if (picked.has(v)) o.classList.add('wrong');
      });
      done(ok);
    };
  } else {
    opts.forEach(o => o.onclick = () => {
      if (o.classList.contains('disabled')) return;
      const ok = o.dataset.v === dispAnswer;
      opts.forEach(x => { if (x.dataset.v === dispAnswer) x.classList.add('right'); });
      if (!ok) o.classList.add('wrong');
      done(ok);
    });
  }
});

if (prevSec !== null) list.appendChild(mkStat(prevSec));   // 最后一章的底部统计条

// 恢复已答状态：锁定并直观展示对错与解析
DATA.forEach((q, i) => {
  const st = progress[i]; if (!st) return;
  const card = cardEls[i];
  const ans = card.dataset.ans || '';
  card.querySelectorAll('.opt').forEach(o => {
    o.classList.add('disabled');
    if (ans && ans.includes(o.dataset.v)) o.classList.add('right');
  });
  const btn = card.querySelector('.multi-submit'); if (btn) btn.disabled = true;
  const verdict = card.querySelector('.verdict');
  verdict.textContent = st === 'c' ? '✓ 已答对（重做可再答）' : '✗ 已答错（重做可再答）';
  verdict.className = 'verdict ' + (st === 'c' ? 'ok' : 'bad');
  card.querySelector('.explain').classList.add('show');
});
applyFilter();
</script>
</body>
